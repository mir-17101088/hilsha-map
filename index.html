<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description"
		content="Explore mapped rivers, power plants and places in central and coastal Bangladesh.">
	<title>The Hilsa’s Obstacle Course</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
		rel="stylesheet">
	<style>
		/* required styles */

		.leaflet-pane,
		.leaflet-tile,
		.leaflet-marker-icon,
		.leaflet-marker-shadow,
		.leaflet-tile-container,
		.leaflet-pane>svg,
		.leaflet-pane>canvas,
		.leaflet-zoom-box,
		.leaflet-image-layer,
		.leaflet-layer {
			position: absolute;
			left: 0;
			top: 0;
		}

		.leaflet-container {
			overflow: hidden;
		}

		.leaflet-tile,
		.leaflet-marker-icon,
		.leaflet-marker-shadow {
			-webkit-user-select: none;
			-moz-user-select: none;
			user-select: none;
			-webkit-user-drag: none;
		}

		/* Prevents IE11 from highlighting tiles in blue */
		.leaflet-tile::selection {
			background: transparent;
		}

		/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
		.leaflet-safari .leaflet-tile {
			image-rendering: -webkit-optimize-contrast;
		}

		/* hack that prevents hw layers "stretching" when loading new tiles */
		.leaflet-safari .leaflet-tile-container {
			width: 1600px;
			height: 1600px;
			-webkit-transform-origin: 0 0;
		}

		.leaflet-marker-icon,
		.leaflet-marker-shadow {
			display: block;
		}

		/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
		/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
		.leaflet-container .leaflet-overlay-pane svg {
			max-width: none !important;
			max-height: none !important;
		}

		.leaflet-container .leaflet-marker-pane img,
		.leaflet-container .leaflet-shadow-pane img,
		.leaflet-container .leaflet-tile-pane img,
		.leaflet-container img.leaflet-image-layer,
		.leaflet-container .leaflet-tile {
			max-width: none !important;
			max-height: none !important;
			width: auto;
			padding: 0;
		}

		.leaflet-container img.leaflet-tile {
			/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
			mix-blend-mode: plus-lighter;
		}

		.leaflet-container.leaflet-touch-zoom {
			-ms-touch-action: pan-x pan-y;
			touch-action: pan-x pan-y;
		}

		.leaflet-container.leaflet-touch-drag {
			-ms-touch-action: pinch-zoom;
			/* Fallback for FF which doesn't support pinch-zoom */
			touch-action: none;
			touch-action: pinch-zoom;
		}

		.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
			-ms-touch-action: none;
			touch-action: none;
		}

		.leaflet-container {
			-webkit-tap-highlight-color: transparent;
		}

		.leaflet-container a {
			-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
		}

		.leaflet-tile {
			filter: inherit;
			visibility: hidden;
		}

		.leaflet-tile-loaded {
			visibility: inherit;
		}

		.leaflet-zoom-box {
			width: 0;
			height: 0;
			-moz-box-sizing: border-box;
			box-sizing: border-box;
			z-index: 800;
		}

		/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
		.leaflet-overlay-pane svg {
			-moz-user-select: none;
		}

		.leaflet-pane {
			z-index: 400;
		}

		.leaflet-tile-pane {
			z-index: 200;
		}

		.leaflet-overlay-pane {
			z-index: 400;
		}

		.leaflet-shadow-pane {
			z-index: 500;
		}

		.leaflet-marker-pane {
			z-index: 600;
		}

		.leaflet-tooltip-pane {
			z-index: 650;
		}

		.leaflet-popup-pane {
			z-index: 700;
		}

		.leaflet-map-pane canvas {
			z-index: 100;
		}

		.leaflet-map-pane svg {
			z-index: 200;
		}

		.leaflet-vml-shape {
			width: 1px;
			height: 1px;
		}

		.lvml {
			behavior: url(#default#VML);
			display: inline-block;
			position: absolute;
		}


		/* control positioning */

		.leaflet-control {
			position: relative;
			z-index: 800;
			pointer-events: visiblePainted;
			/* IE 9-10 doesn't have auto */
			pointer-events: auto;
		}

		.leaflet-top,
		.leaflet-bottom {
			position: absolute;
			z-index: 1000;
			pointer-events: none;
		}

		.leaflet-top {
			top: 0;
		}

		.leaflet-right {
			right: 0;
		}

		.leaflet-bottom {
			bottom: 0;
		}

		.leaflet-left {
			left: 0;
		}

		.leaflet-control {
			float: left;
			clear: both;
		}

		.leaflet-right .leaflet-control {
			float: right;
		}

		.leaflet-top .leaflet-control {
			margin-top: 10px;
		}

		.leaflet-bottom .leaflet-control {
			margin-bottom: 10px;
		}

		.leaflet-left .leaflet-control {
			margin-left: 10px;
		}

		.leaflet-right .leaflet-control {
			margin-right: 10px;
		}


		/* zoom and fade animations */

		.leaflet-fade-anim .leaflet-popup {
			opacity: 0;
			-webkit-transition: opacity 0.2s linear;
			-moz-transition: opacity 0.2s linear;
			transition: opacity 0.2s linear;
		}

		.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
			opacity: 1;
		}

		.leaflet-zoom-animated {
			-webkit-transform-origin: 0 0;
			-ms-transform-origin: 0 0;
			transform-origin: 0 0;
		}

		svg.leaflet-zoom-animated {
			will-change: transform;
		}

		.leaflet-zoom-anim .leaflet-zoom-animated {
			-webkit-transition: -webkit-transform 0.25s cubic-bezier(0, 0, 0.25, 1);
			-moz-transition: -moz-transform 0.25s cubic-bezier(0, 0, 0.25, 1);
			transition: transform 0.25s cubic-bezier(0, 0, 0.25, 1);
		}

		.leaflet-zoom-anim .leaflet-tile,
		.leaflet-pan-anim .leaflet-tile {
			-webkit-transition: none;
			-moz-transition: none;
			transition: none;
		}

		.leaflet-zoom-anim .leaflet-zoom-hide {
			visibility: hidden;
		}


		/* cursors */

		.leaflet-interactive {
			cursor: pointer;
		}

		.leaflet-grab {
			cursor: -webkit-grab;
			cursor: -moz-grab;
			cursor: grab;
		}

		.leaflet-crosshair,
		.leaflet-crosshair .leaflet-interactive {
			cursor: crosshair;
		}

		.leaflet-popup-pane,
		.leaflet-control {
			cursor: auto;
		}

		.leaflet-dragging .leaflet-grab,
		.leaflet-dragging .leaflet-grab .leaflet-interactive,
		.leaflet-dragging .leaflet-marker-draggable {
			cursor: move;
			cursor: -webkit-grabbing;
			cursor: -moz-grabbing;
			cursor: grabbing;
		}

		/* marker & overlays interactivity */
		.leaflet-marker-icon,
		.leaflet-marker-shadow,
		.leaflet-image-layer,
		.leaflet-pane>svg path,
		.leaflet-tile-container {
			pointer-events: none;
		}

		.leaflet-marker-icon.leaflet-interactive,
		.leaflet-image-layer.leaflet-interactive,
		.leaflet-pane>svg path.leaflet-interactive,
		svg.leaflet-image-layer.leaflet-interactive path {
			pointer-events: visiblePainted;
			/* IE 9-10 doesn't have auto */
			pointer-events: auto;
		}

		/* visual tweaks */

		.leaflet-container {
			background: #ddd;
			outline-offset: 1px;
		}

		.leaflet-container a {
			color: #0078A8;
		}

		.leaflet-zoom-box {
			border: 2px dotted #38f;
			background: rgba(255, 255, 255, 0.5);
		}


		/* general typography */
		.leaflet-container {
			font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
			font-size: 12px;
			font-size: 0.75rem;
			line-height: 1.5;
		}


		/* general toolbar styles */

		.leaflet-bar {
			box-shadow: 0 1px 5px rgba(0, 0, 0, 0.65);
			border-radius: 4px;
		}

		.leaflet-bar a {
			background-color: #fff;
			border-bottom: 1px solid #ccc;
			width: 26px;
			height: 26px;
			line-height: 26px;
			display: block;
			text-align: center;
			text-decoration: none;
			color: black;
		}

		.leaflet-bar a,
		.leaflet-control-layers-toggle {
			background-position: 50% 50%;
			background-repeat: no-repeat;
			display: block;
		}

		.leaflet-bar a:hover,
		.leaflet-bar a:focus {
			background-color: #f4f4f4;
		}

		.leaflet-bar a:first-child {
			border-top-left-radius: 4px;
			border-top-right-radius: 4px;
		}

		.leaflet-bar a:last-child {
			border-bottom-left-radius: 4px;
			border-bottom-right-radius: 4px;
			border-bottom: none;
		}

		.leaflet-bar a.leaflet-disabled {
			cursor: default;
			background-color: #f4f4f4;
			color: #bbb;
		}

		.leaflet-touch .leaflet-bar a {
			width: 30px;
			height: 30px;
			line-height: 30px;
		}

		.leaflet-touch .leaflet-bar a:first-child {
			border-top-left-radius: 2px;
			border-top-right-radius: 2px;
		}

		.leaflet-touch .leaflet-bar a:last-child {
			border-bottom-left-radius: 2px;
			border-bottom-right-radius: 2px;
		}

		/* zoom control */

		.leaflet-control-zoom-in,
		.leaflet-control-zoom-out {
			font: bold 18px 'Lucida Console', Monaco, monospace;
			text-indent: 1px;
		}

		.leaflet-touch .leaflet-control-zoom-in,
		.leaflet-touch .leaflet-control-zoom-out {
			font-size: 22px;
		}


		/* layers control */

		.leaflet-control-layers {
			box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
			background: #fff;
			border-radius: 5px;
		}

		.leaflet-control-layers-toggle {
			background-image: none;
			width: 36px;
			height: 36px;
		}

		.leaflet-retina .leaflet-control-layers-toggle {
			background-image: none;
			background-size: 26px 26px;
		}

		.leaflet-touch .leaflet-control-layers-toggle {
			width: 44px;
			height: 44px;
		}

		.leaflet-control-layers .leaflet-control-layers-list,
		.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
			display: none;
		}

		.leaflet-control-layers-expanded .leaflet-control-layers-list {
			display: block;
			position: relative;
		}

		.leaflet-control-layers-expanded {
			padding: 6px 10px 6px 6px;
			color: #333;
			background: #fff;
		}

		.leaflet-control-layers-scrollbar {
			overflow-y: scroll;
			overflow-x: hidden;
			padding-right: 5px;
		}

		.leaflet-control-layers-selector {
			margin-top: 2px;
			position: relative;
			top: 1px;
		}

		.leaflet-control-layers label {
			display: block;
			font-size: 13px;
			font-size: 1.08333em;
		}

		.leaflet-control-layers-separator {
			height: 0;
			border-top: 1px solid #ddd;
			margin: 5px -10px 5px -6px;
		}

		/* Default icon URLs */
		.leaflet-default-icon-path {
			/* used only in path-guessing heuristic, see L.Icon.Default */
			background-image: none;
		}


		/* attribution and scale controls */

		.leaflet-container .leaflet-control-attribution {
			background: #fff;
			background: rgba(255, 255, 255, 0.8);
			margin: 0;
		}

		.leaflet-control-attribution,
		.leaflet-control-scale-line {
			padding: 0 5px;
			color: #333;
			line-height: 1.4;
		}

		.leaflet-control-attribution a {
			text-decoration: none;
		}

		.leaflet-control-attribution a:hover,
		.leaflet-control-attribution a:focus {
			text-decoration: underline;
		}

		.leaflet-attribution-flag {
			display: inline !important;
			vertical-align: baseline !important;
			width: 1em;
			height: 0.6669em;
		}

		.leaflet-left .leaflet-control-scale {
			margin-left: 5px;
		}

		.leaflet-bottom .leaflet-control-scale {
			margin-bottom: 5px;
		}

		.leaflet-control-scale-line {
			border: 2px solid #777;
			border-top: none;
			line-height: 1.1;
			padding: 2px 5px 1px;
			white-space: nowrap;
			-moz-box-sizing: border-box;
			box-sizing: border-box;
			background: rgba(255, 255, 255, 0.8);
			text-shadow: 1px 1px #fff;
		}

		.leaflet-control-scale-line:not(:first-child) {
			border-top: 2px solid #777;
			border-bottom: none;
			margin-top: -2px;
		}

		.leaflet-control-scale-line:not(:first-child):not(:last-child) {
			border-bottom: 2px solid #777;
		}

		.leaflet-touch .leaflet-control-attribution,
		.leaflet-touch .leaflet-control-layers,
		.leaflet-touch .leaflet-bar {
			box-shadow: none;
		}

		.leaflet-touch .leaflet-control-layers,
		.leaflet-touch .leaflet-bar {
			border: 2px solid rgba(0, 0, 0, 0.2);
			background-clip: padding-box;
		}


		/* popup */

		.leaflet-popup {
			position: absolute;
			text-align: center;
			margin-bottom: 20px;
		}

		.leaflet-popup-content-wrapper {
			padding: 1px;
			text-align: left;
			border-radius: 12px;
		}

		.leaflet-popup-content {
			margin: 13px 24px 13px 20px;
			line-height: 1.3;
			font-size: 13px;
			font-size: 1.08333em;
			min-height: 1px;
		}

		.leaflet-popup-content p {
			margin: 17px 0;
			margin: 1.3em 0;
		}

		.leaflet-popup-tip-container {
			width: 40px;
			height: 20px;
			position: absolute;
			left: 50%;
			margin-top: -1px;
			margin-left: -20px;
			overflow: hidden;
			pointer-events: none;
		}

		.leaflet-popup-tip {
			width: 17px;
			height: 17px;
			padding: 1px;

			margin: -10px auto 0;
			pointer-events: auto;

			-webkit-transform: rotate(45deg);
			-moz-transform: rotate(45deg);
			-ms-transform: rotate(45deg);
			transform: rotate(45deg);
		}

		.leaflet-popup-content-wrapper,
		.leaflet-popup-tip {
			background: white;
			color: #333;
			box-shadow: 0 3px 14px rgba(0, 0, 0, 0.4);
		}

		.leaflet-container a.leaflet-popup-close-button {
			position: absolute;
			top: 0;
			right: 0;
			border: none;

			height: 24px;

			color: #757575;
			text-decoration: none;
			background: transparent;
		}

		.leaflet-container a.leaflet-popup-close-button:hover,
		.leaflet-container a.leaflet-popup-close-button:focus {
			color: #585858;
		}

		.leaflet-popup-scrolled {
			overflow: auto;
		}

		.leaflet-oldie .leaflet-popup-content-wrapper {
			-ms-zoom: 1;
		}

		.leaflet-oldie .leaflet-popup-tip {
			width: 24px;
			margin: 0 auto;

			-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
			filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
		}

		.leaflet-oldie .leaflet-control-zoom,
		.leaflet-oldie .leaflet-control-layers,

			border: 1px solid #999;
		}


		/* div icon */

		.leaflet-div-icon {
			background: #fff;
			border: 1px solid #666;
		}


		/* Tooltip */
		/* Base styles for the element that has a tooltip */
		.leaflet-tooltip {
			position: absolute;
			padding: 6px;
			background-color: #fff;
			border: 1px solid #fff;
			border-radius: 3px;
			color: #222;
			white-space: nowrap;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;

		}

		.leaflet-tooltip.leaflet-interactive {
			cursor: pointer;
			pointer-events: auto;
		}

		.leaflet-tooltip-top:before,
		.leaflet-tooltip-bottom:before,
		.leaflet-tooltip-left:before,
		.leaflet-tooltip-right:before {
			position: absolute;
			pointer-events: none;
			border: 6px solid transparent;
			background: transparent;
			content: "";
		}

		/* Directions */

		.leaflet-tooltip-bottom {
			margin-top: 6px;
		}

		.leaflet-tooltip-top {
			margin-top: -6px;
		}

		.leaflet-tooltip-bottom:before,
		.leaflet-tooltip-top:before {
			left: 50%;
			margin-left: -6px;
		}

		.leaflet-tooltip-top:before {
			bottom: 0;
			margin-bottom: -12px;
			border-top-color: #fff;
		}

		.leaflet-tooltip-bottom:before {
			top: 0;
			margin-top: -12px;
			margin-left: -6px;
			border-bottom-color: #fff;
		}

		.leaflet-tooltip-left {
			margin-left: -6px;
		}

		.leaflet-tooltip-right {
			margin-left: 6px;
		}

		.leaflet-tooltip-left:before,
		.leaflet-tooltip-right:before {
			top: 50%;
			margin-top: -6px;
		}

		.leaflet-tooltip-left:before {
			right: 0;
			margin-right: -12px;
			border-left-color: #fff;
		}

		.leaflet-tooltip-right:before {
			left: 0;
			margin-left: -12px;
			border-right-color: #fff;
		}

		/* Printing */

		@media print {

			/* Prevent printers from removing background-images of controls. */
			.leaflet-control {
				-webkit-print-color-adjust: exact;
				print-color-adjust: exact;

	<style>
		:root {
			color-scheme: light;
			--ink: #1f3033;
			--river: #0f6fc9;
			--plant: #d63a29;
			--place: #c07a10;
			--paper: #fffdf8;
			--line: #e7e0d2;
			--display: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--sans: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif
		}

		* {
			box-sizing: border-box
		}

		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			font-family: var(--sans);
			color: var(--ink);
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility
		}

		#frame {
			position: relative;
			width: 100%;
			height: 100%;
			height: 100dvh;
			background: #e3eeea;
			isolation: isolate
		}

		#map {
			position: absolute;
			inset: 0;
			background: #dcebef;
			cursor: default
		}

		.leaflet-tile-pane {
			filter: saturate(.92) brightness(1.02)
		}

		.leaflet-container {
			font-family: inherit
		}

		.leaflet-control-attribution {
			font-size: 10px !important;
			background: rgba(255, 254, 251, .92) !important;
			max-width: 95vw
		}

		.leaflet-control-attribution a {
			color: #3d6268
		}

		.leaflet-control-scale {
			margin-bottom: 24px !important;
			margin-left: 18px !important
		}

		.leaflet-control-scale-line {
			border-color: #516768;
			color: #344d50;
			background: #fffefbda;
			font-size: 10px
		}

		#heading {
			position: absolute;
			z-index: 600;
			right: 24px;
			top: 24px;
			width: 288px;
			background: var(--paper);
			padding: 20px 20px 18px;
			border-top: 3px solid var(--ink);
			border-radius: 12px;
			box-shadow: 0 10px 30px #233b3d1f
		}

		h1 {
			font-family: var(--display);
			font-size: 25px;
			letter-spacing: -.3px;
			line-height: 1.1;
			margin: 0 0 10px;
			font-weight: 800
		}

		#heading p {
			font-size: 13px;
			line-height: 1.55;
			margin: 0;
			color: #52676a
		}

		#legend {
			position: absolute;
			z-index: 610;
			bottom: 26px;
			right: 24px;
			display: flex;
			flex-direction: column;
			gap: 3px;
			padding: 9px;
			background: var(--paper);
			border: 1px solid var(--line);
			box-shadow: 0 10px 30px #233b3d24;
			border-radius: 14px;
			min-width: 208px
		}

		button {
			font: inherit;
			color: inherit;
			cursor: pointer
		}

		button:focus-visible,
		a:focus-visible {
			outline: 3px solid #174e7d;
			outline-offset: 3px
		}

		.legend-button {
			border: 1px solid transparent;
			background: transparent;
			padding: 9px 10px 9px 11px;
			display: flex;
			align-items: center;
			gap: 11px;
			text-align: left;
			font-size: 12.5px;
			font-weight: 600;
			min-height: 42px;
			width: 100%;
			border-radius: 9px;
			transition: background .15s, border-color .15s, transform .06s
		}

		.legend-button:hover {
			background: #f2f5f0;
			border-color: #e5ebe3
		}

		.legend-button:active {
			transform: translateY(.5px)
		}

		.legend-button[aria-pressed="false"] {
			color: #97a09d
		}

		.legend-button[aria-pressed="false"] .swatch {
			opacity: .35
		}

		.legend-label {
			margin-right: 4px
		}

		.legend-switch {
			margin-left: auto;
			position: relative;
			width: 36px;
			height: 21px;
			border-radius: 999px;
			background: #cdd6d0;
			flex-shrink: 0;
			transition: background .18s;
			box-shadow: inset 0 0 0 1px #0000001a
		}

		.legend-switch::after {
			content: "";
			position: absolute;
			top: 2.5px;
			left: 2.5px;
			width: 16px;
			height: 16px;
			border-radius: 50%;
			background: #fff;
			box-shadow: 0 1px 3px #00000040;
			transition: transform .18s
		}

		.legend-button[aria-pressed="true"] .legend-switch {
			background: var(--color)
		}

		.legend-button[aria-pressed="true"] .legend-switch::after {
			transform: translateX(15px)
		}

		.swatch {
			display: inline-block;
			width: 14px;
			height: 14px;
			background: var(--color);
			flex-shrink: 0;
			border-radius: 50%
		}

		.swatch.river {
			width: 15px;
			height: 4px;
			border-radius: 2px
		}

		#labels {
			position: absolute;
			inset: 0;
			z-index: 450;
			pointer-events: none;
			overflow: hidden
		}

		#leaders {
			position: absolute;
			inset: 0;
			z-index: 440;
			pointer-events: none;
			width: 100%;
			height: 100%
		}

		.map-label {
			position: absolute;
			pointer-events: auto;
			border: 1px solid #ffffffd0;
			background: #fffdf8f2;
			padding: 5px 8px;
			border-radius: 6px;
			font-size: 11px;
			line-height: 14px;
			white-space: nowrap;
			box-shadow: 0 2px 8px #233b3d22;
			color: var(--color);
			font-weight: 600;
			max-width: 200px
		}

		.map-label:hover,
		.map-label[aria-expanded="true"] {
			background: var(--color);
			color: white;
			border-color: var(--color);
			z-index: 2
		}

		.map-label.plant {
			font-weight: 700;
			border-left: 3px solid var(--plant)
		}

		.map-label.place {
			font-weight: 600
		}

		.map-label.river {
			background: #fffdf8e6
		}

		.map-label.river:hover,
		.map-label.river[aria-expanded="true"] {
			background: var(--river)
		}

		.point-icon {
			background: none;
			border: 0
		}

		.point-button {
			width: 44px;
			height: 44px;
			border: 0;
			display: grid;
			place-items: center;
			padding: 0;
			background: transparent;
			cursor: pointer;
			-webkit-tap-highlight-color: transparent
		}

		.point-button span {
			width: 20px;
			height: 20px;
			background: var(--color);
			border: 2px solid #fff;
			border-radius: 50%;
			box-shadow: 0 0 0 1px #00000030;
			transition: transform .14s
		}

		.point-button:hover span,
		.point-button:focus-visible span {
			transform: scale(1.18)
		}

		#detail {
			position: absolute;
			z-index: 700;
			right: 24px;
			top: 218px;
			width: 285px;
			background: var(--paper);
			padding: 20px;
			box-shadow: 0 4px 25px #233b3d25;
			border-top: 3px solid var(--selected-color);
			max-height: calc(100% - 400px);
			overflow: auto
		}

		#detail[hidden] {
			display: none
		}

		#detail-kind {
			color: var(--selected-color);
			font-size: 10px;
			text-transform: uppercase;
			letter-spacing: 1.3px;
			font-weight: 700;
			margin-bottom: 9px
		}

		#detail-name {
			font-family: var(--display);
			font-size: 21px;
			font-weight: 800;
			line-height: 1.15;
			display: block;
			padding-right: 18px;
			letter-spacing: -.3px
		}

		#detail p {
			font-size: 12px;
			line-height: 1.55;
			margin: 12px 0
		}

		#detail .precision {
			font-size: 11px;
			color: #637275;
			border-top: 1px solid #dce3dc;
			padding-top: 12px
		}

		#detail .coords {
			font-family: ui-monospace, Consolas, monospace;
			font-size: 10px;
			color: #6c7878;
			margin: 12px 0
		}

		#detail a {
			color: var(--selected-color);
			font-size: 11px;
			display: inline-block;
			margin: 3px 12px 3px 0;
			text-underline-offset: 3px
		}

		#detail .source-note {
			font-size: 10px;
			color: #6c7878;
			display: block;
			margin-top: 5px
		}

		#close {
			position: absolute;
			right: 9px;
			top: 8px;
			background: transparent;
			border: 0;
			font-size: 25px;
			width: 32px;
			height: 32px;
			line-height: 1;
			color: #536164
		}

		#status {
			position: absolute;
			left: 50%;
			top: 12px;
			transform: translateX(-50%);
			z-index: 800;
			background: var(--paper);
			font-size: 12px;
			padding: 10px 15px;
			border: 1px solid #d4ded8;
			max-width: 80%
		}

		#status[hidden] {
			display: none
		}

		.name-tip {
			max-width: 230px;
			white-space: nowrap;
			font-family: var(--sans);
			font-weight: 600;
			font-size: 12px;
			line-height: 1.2;
			color: var(--ink);
			background: var(--paper);
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 5px 10px;
			box-shadow: 0 4px 14px #233b3d28
		}

		.leaflet-tooltip {
			font-family: var(--sans)
		}

		.name-tip.leaflet-tooltip-top:before {
			border-top-color: var(--paper)
		}

		.name-tip.leaflet-tooltip-bottom:before {
			border-bottom-color: var(--paper)
		}

		.name-tip.leaflet-tooltip-left:before {
			border-left-color: var(--paper)
		}

		.name-tip.leaflet-tooltip-right:before {
			border-right-color: var(--paper)
		}

		.sanctuary-label {
			background: #eaf7f0e8;
			color: #0c6b46;
			font-weight: 700;
			font-size: 12px;
			letter-spacing: .6px;
			text-transform: uppercase;
			border: 1px solid #1fae7055;
			border-radius: 7px;
			padding: 3px 10px;
			box-shadow: 0 2px 9px #10613f26;
			white-space: nowrap
		}

		.sanctuary-label:before {
			display: none !important
		}

		@media(min-width:1500px) {
			#heading {
				right: 32px;
				top: 32px;
				width: 325px
			}

			h1 {
				font-size: 28px
			}

			#detail {
				right: 32px;
				width: 325px;
				top: 230px
			}

			#legend {
				right: 32px
			}
		}

		@media(max-width:680px) {
			#heading {
				top: 12px;
				left: 50%;
				right: auto;
				transform: translateX(-50%);
				width: min(340px, calc(100% - 24px));
				padding: 14px 16px;
				border-top-width: 2px;
				text-align: center
			}

			h1 {
				font-size: 21px;
				margin-bottom: 7px;
				letter-spacing: -.3px
			}

			#heading p {
				font-size: 11px;
				line-height: 1.45
			}

			#legend {
				bottom: 26px;
				right: 12px;
				left: 12px;
				min-width: 0;
				flex-direction: row;
				flex-wrap: wrap;
				justify-content: center;
				padding: 4px;
				gap: 2px
			}

			.legend-button {
				padding: 8px 9px;
				font-size: 11px;
				gap: 7px;
				min-height: 36px;
				width: auto
			}

			.map-label {
				font-size: 10px;
				line-height: 12px;
				padding: 4px 5px;
				max-width: 175px
			}

			#detail {
				top: auto !important;
				right: 12px;
				left: 12px;
				width: auto;
				bottom: 82px;
				max-height: min(310px, 48%);
				padding: 16px
			}

			#detail-name {
				font-size: 18px
			}

			#detail p {
				margin: 8px 0
			}

			#detail-kind {
				margin-bottom: 7px
			}

			.leaflet-control-scale {
				margin-bottom: 78px !important;
				margin-left: 12px !important
			}
		}

		@media(max-height:520px) and (min-width:681px) {
			#heading {
				top: 12px;
				padding: 12px 16px
			}

			h1 {
				font-size: 24px
			}

			#heading p {
				font-size: 11px
			}

			#detail {
				top: 165px;
				max-height: calc(100% - 185px)
			}

			#legend {
				bottom: 28px;
				flex-direction: row;
				right: 24px;
				min-width: 0;
				padding: 3px
			}

			.legend-button {
				padding: 7px;
				font-size: 10px
			}

			body.detail-open #legend {
				visibility: hidden
			}
		}

		@media(prefers-reduced-motion:reduce) {
			* {
				scroll-behavior: auto !important
			}
		}
	</style>
</head>

<body>
	<main id="frame" aria-label="Interactive map of Bangladesh’s hilsa waters">
		<div id="map" aria-label="Fixed map of central and coastal Bangladesh"></div>
		<svg id="leaders" aria-hidden="true"></svg>
		<div id="labels" aria-label="Mapped features"></div>
		<header id="heading">
			<h1>The Hilsa’s<br>Obstacle Course</h1>
			<p>Swimming against the current, hilsa are hitting chokepoints where poor navigability and low water flow
				block the way inland.<br>Click a point or river to explore.</p>
		</header>
		<nav id="legend" aria-label="Map legend. Toggle a category on or off.">
			<button class="legend-button" data-kind="river" aria-pressed="true" style="--color:var(--river)"><i
					class="swatch river"></i><span class="legend-label">Rivers</span><span class="legend-switch"
					aria-hidden="true"></span></button>
			<button class="legend-button" data-kind="plant" aria-pressed="true" style="--color:var(--plant)"><i
					class="swatch plant"></i><span class="legend-label">Power Plants</span><span class="legend-switch"
					aria-hidden="true"></span></button>
			<button class="legend-button" data-kind="place" aria-pressed="true" style="--color:var(--place)"><i
					class="swatch place"></i><span class="legend-label">Hilsa Migration Routes</span><span
					class="legend-switch" aria-hidden="true"></span></button>
		</nav>
		<section id="detail" role="region" aria-label="Selected feature" hidden tabindex="-1">
			<button id="close" aria-label="Close feature details">×</button>
			<div id="detail-kind"></div><strong id="detail-name"></strong>
			<p id="detail-description"></p>
		</section>
		<div id="status" role="status">Loading map…</div>
		<noscript>This interactive map needs JavaScript enabled.</noscript>
	</main>

				hit.on('mouseover', () => path.setStyle({ weight: rw + 1.5, opacity: 1 })); hit.on('mouseout', () => path.setStyle({ weight: rw, opacity: .95 }));
			}
			const marker = L.marker(f.latlng, { icon: L.divIcon({ className: 'point-icon', html: `<button class="point-button ${f.kind}" style="--color:${color}" aria-label="${esc(f.name)}"><span></span></button>`, iconSize: [44, 44], iconAnchor: [22, 22] }), keyboard: false, interactive: true, bubblingMouseEvents: false, zIndexOffset: f.kind === 'plant' ? 100 : 0, autoPanOnFocus: false }).addTo(groups[f.kind]);
			marker.on('click', () => choose(f, marker.getElement().querySelector('button')));
			marker.bindTooltip(esc(f.name), { direction: 'top', offset: [0, -13], className: 'name-tip', opacity: 1 });
			const label = document.createElement('button'); label.className = 'map-label ' + f.kind; label.textContent = f.name; label.style.setProperty('--color', color); label.setAttribute('aria-expanded', 'false'); label.setAttribute('aria-controls', 'detail'); label.dataset.feature = f.id; label.addEventListener('click', () => choose(f, label)); labels.appendChild(label);
			registry.push({ f, label, marker });
		}
		// Supplied polygons are context outlines, not legally surveyed plant boundaries.
		for (const outline of DATA.outlines) {
			const isComplex = outline.name.includes('Payra');
			const poly = L.polygon(outline.coords, { color: COLORS.plant, weight: 1.2, fillOpacity: .12, interactive: true, bubblingMouseEvents: false }).addTo(groups.plant);
			const f = isComplex ? { id: 'complex', name: 'Dhankhali Power Plants', kind: 'plant', description: 'The neighboring Payra and Patuakhali coal-fired plants sit beside coastal waters used by hilsa. Environmental advocates raise concerns about waste, heated-water discharges and coal-vessel traffic affecting breeding habitat.' } : DATA.features.find(f => f.id === 'barishal');
			poly.on('click', () => choose(f));
		}
		// Hilsa sanctuary zone — always on; the circle + label make it self-explanatory, so no legend entry.
		const sanctuary = L.circle([22.16, 90.34], { radius: 70000, color: '#0e7a52', weight: 1.6, dashArray: '2 7', fillColor: '#1fae70', fillOpacity: .12, interactive: false }).addTo(map);
		sanctuary.bringToBack();
		sanctuary.bindTooltip('Hilsa Sanctuary', { permanent: true, direction: 'center', className: 'sanctuary-label', interactive: false });
		document.querySelectorAll('.legend-button').forEach(btn => btn.addEventListener('click', () => { const k = btn.dataset.kind; visible[k] = !visible[k]; btn.setAttribute('aria-pressed', String(visible[k])); if (visible[k]) groups[k].addTo(map); else map.removeLayer(groups[k]); if (selected?.kind === k && !visible[k]) closeDetails(false); layoutLabels(); }));
		function overlaps(a, b, gap = 4) { return a.x < b.x + b.w + gap && a.x + a.w + gap > b.x && a.y < b.y + b.h + gap && a.y + a.h + gap > b.y; }
		function rect(el) { const r = el.getBoundingClientRect(), o = document.getElementById('frame').getBoundingClientRect(); return { x: r.x - o.x, y: r.y - o.y, w: r.width, h: r.height }; }
		function layoutLabels() {
			const size = map.getSize(), mobile = size.x <= 680;
			const forbidden = [rect(document.getElementById('heading')), rect(document.getElementById('legend'))];
			if (!mobile) forbidden.push({ x: size.x - (size.x >= 1500 ? 363 : 329), y: 0, w: 400, h: size.y });
			const occupied = [...forbidden]; let svg = '';
			const active = registry.filter(r => visible[r.f.kind] && LABEL_IDS.has(r.f.id));
			registry.forEach(r => { r.label.hidden = !visible[r.f.kind] || !LABEL_IDS.has(r.f.id); r.label.textContent = mobile ? r.f.name.replace(' River', '').replace(' Power Plant', ' plant') : r.f.name; r.label.setAttribute('aria-label', r.f.name); });
			// Place plants first. All labels retain leader lines to their original coordinates.
			active.sort((a, b) => ({ plant: 0, place: 1, river: 2 }[a.f.kind] - { plant: 0, place: 1, river: 2 }[b.f.kind]) || a.f.latlng[0] - b.f.latlng[0]);
			const points = registry.filter(r => visible[r.f.kind]).map(r => map.latLngToContainerPoint(r.f.latlng));
			for (const r of active) {
				const p = map.latLngToContainerPoint(r.f.latlng), w = r.label.offsetWidth, h = r.label.offsetHeight;
				let best = null, score = Infinity;
				for (let rad = 0; rad <= 300; rad += 18) {
					const candidates = rad === 0 ? [[p.x + 13, p.y - h / 2], [p.x - w - 13, p.y - h / 2]] : Array.from({ length: 16 }, (_, i) => { const angle = i * Math.PI / 8; return [p.x + Math.cos(angle) * rad - w / 2, p.y + Math.sin(angle) * rad - h / 2]; });
					for (const [x, y] of candidates) {
						const box = { x, y, w, h }; if (x < 8 || y < 8 || x + w > size.x - 8 || y + h > size.y - 24) continue;
						if (occupied.some(b => overlaps(box, b))) continue;
						if (points.some(q => q.x > x - 13 && q.x < x + w + 13 && q.y > y - 13 && q.y < y + h + 13)) continue;
						const dx = Math.max(x - p.x, 0, p.x - x - w), dy = Math.max(y - p.y, 0, p.y - y - h), s = dx * dx + dy * dy;
						if (s < score) { best = box; score = s; }
					}
					if (best && rad > Math.sqrt(score) + w) break;
				}
				if (!best) {
					// Dense / very short embeds: keep labels available in the nearest free slot.
					outer: for (let y = 8; y < size.y - h - 24; y += h + 5)for (let x = 8; x < size.x - w - 8; x += 12) { const b = { x, y, w, h }; if (!occupied.some(o => overlaps(b, o))) { best = b; break outer; } }
				}
				if (!best) { r.label.hidden = true; continue; }
				r.label.style.left = Math.round(best.x) + 'px'; r.label.style.top = Math.round(best.y) + 'px'; occupied.push(best);
				const x = Math.max(best.x, Math.min(p.x, best.x + w)), y = Math.max(best.y, Math.min(p.y, best.y + h));
				if (Math.hypot(x - p.x, y - p.y) > 4) svg += `<line x1="${p.x}" y1="${p.y}" x2="${x}" y2="${y}" stroke="${COLORS[r.f.kind]}" stroke-opacity=".55" stroke-width="1"/>`;
			}
			leaders.innerHTML = svg;
		}
		function resize() {
			map.invalidateSize({ pan: false }); const s = map.getSize(), mobile = s.x <= 680;
			const heading = rect(document.getElementById('heading')), legend = rect(document.getElementById('legend'));
			const right = mobile ? 20 : (s.x >= 1500 ? 385 : 350);
			map.fitBounds([[21.55, 89.2], [24.25, 91.5]], { paddingTopLeft: [mobile ? 18 : 80, mobile ? heading.y + heading.h + 22 : 36], paddingBottomRight: [right, mobile ? s.y - legend.y + 26 : 88], animate: false });
			// Details stay within the same right-side reserve as the title.
			if (!mobile) detail.style.top = (heading.y + heading.h + 18) + 'px';
			layoutLabels();
		}
		let resizeFrame; new ResizeObserver(() => { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(resize); }).observe(document.getElementById('frame'));
		resize();
		setTimeout(() => { if (!status.hidden && status.textContent === 'Loading map…') { status.textContent = 'Map tiles are taking longer to load. Labels remain clickable.'; } }, 15000);
	</script>
